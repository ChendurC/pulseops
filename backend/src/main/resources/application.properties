spring.application.name=pulseops

# Database: password comes from the environment, never from code
spring.datasource.url=jdbc:postgresql://localhost:5432/pulseops
spring.datasource.username=pulseops
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway owns the schema; Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session cookie hardening (Secure flag is added in the prod profile later)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Uploads: hard size limit enforced before our code runs
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Where uploaded files are stored (shared with the Python worker).
# Default "../uploads" = the uploads/ folder at the project root when run from backend/.
pulseops.storage.local-dir=${PULSEOPS_UPLOAD_DIR:../uploads}

# Health endpoint
management.endpoints.web.exposure.include=health

# Demo users are only created when the "dev" profile is active.
# Their password is read from the environment variable PULSEOPS_DEMO_PASSWORD.

# Logging: readable text on the console, structured JSON (Elastic Common Schema) in a file.
# Every line carries correlation_id, and tenant_id/user_id once the user is known.
logging.file.name=../logs/backend.log
logging.structured.format.file=ecs
logging.structured.ecs.service.name=pulseops-backend
