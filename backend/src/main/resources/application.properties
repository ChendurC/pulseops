spring.application.name=pulseops

# Database: password comes from the environment, never from code
spring.datasource.url=jdbc:postgresql://localhost:5432/pulseops
spring.datasource.username=pulseops
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway owns the schema; Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session cookie hardening (Secure flag is added in the prod profile later)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Health endpoint
management.endpoints.web.exposure.include=health

# Demo users are only created when the "dev" profile is active.
# Their password is read from the environment variable PULSEOPS_DEMO_PASSWORD.
