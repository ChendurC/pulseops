<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · PulseOps</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <div class="brand"><span class="brand-mark" aria-hidden="true">◆</span> PulseOps</div>
    <p class="tagline">Build reports. Monitor integrations. Diagnose failures.</p>

    <div class="alert alert-error" th:if="${param.error}" role="alert">
        Invalid username or password.
    </div>
    <div class="alert alert-success" th:if="${param.logout}" role="status">
        You have been signed out.
    </div>

    <!-- th:action makes Thymeleaf add the hidden CSRF token automatically -->
    <form th:action="@{/login}" method="post" class="form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="btn btn-primary">Sign in</button>
    </form>

    <p class="hint">Local demo accounts are created by the <code>dev</code> profile. See the README.</p>
</main>
</body>
</html>
